	<div class="container-fluid m-0 p-0 pe-2">
		<div class="row orderingContainer m-0 p-0">
			<div class="col enquiriesContainer m-1 p-1">

				<div class="row disableDatesWrapper m-1 p-1">
					<h1 class="m-1 p-1">Disabled ordering dates</h1>
					<div class="container text-center m-0 p-0">
						<div class="row">
							<label for="disableEnable">Do you want to enable or disable dates ?</label>
							<div class="btn-group">
								<select id="disableEnable" class="form-control">
									<option value="0" selected min="2" max="3">Please select an option</option>
									<option value="1">Disable</option>
									<option value="2">Enable</option>
								</select>
							</div>
						</div>
						<div class="row" id="DateOptionsWrapper">
							<label for="DateOptions">Single date or date range ?</label>
							<div class="btn-group">
								<select id="DateOptions" class="form-control">
									<option value="0" selected min="2" max="3">Please select an option</option>
									<option value="1">Singles - To Pick 1 date or multiple single dates</option>
									<option value="2">Range - To and From date range</option>
								</select>
							</div>
						</div>
						<div class="row" id="disableDatesWrapper">
							<label for="disableDates" id="disableDatesLabel">Disable Dates:</label>
							<label for="disableDates" id="enableDatesLabel">Enable Dates:</label>
							<div class="btn-group">
								<input class="form-control" id="disableDates" placeholder="Select Dates...">
							</div>
							<div class="btn-group mt-3 submit-group" id="submitWrapper">
								<button type="submit" class="btn btn-primary" id="submitDisable">Submit</button>
							</div>
						</div>
					</div>
				</div>
				<div class="row enquiriesList m-0 p-0">
					<h1 class="m-1 p-1" id="inboxHeader">Inbox</h1>
					
					<div class="col inboxTable m-0 p-0">
						<table id="enquiries"></table>
					</div>
				</div>

				
			</div>
			<div class="col ordersContainer m-1 p-1">
				<div class="row ordersCalender m-0 p-0">
					<h1 class="m-1 p-1">Calendar View</h1>
					<!--<div class="col" id="calendar">

					</div>-->

					<!--<div id="calendar"></div>-->
					<div class="layout">
						<div id="calendar"></div>
						<div class="sidebar">
							<div id="next-event">
								<h4>Next Upcoming Event</h4>
								<p style="color:#888;">No upcoming events.</p>
							</div>
							<div id="day-details">
								<p style="color:#888;">Click a day or event to see details</p>
							</div>
						</div>
					</div>
					<!--<div class="col calendar"> 
						<div class="calendar-header">

				</div>
			</div>

		</div>
	</div>

	<div class="modal fade" data-bs-backdrop="static" data-bs-keybaord="false" tabindex="-1" id="confirmEnquiry">
		<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content" >

				<div class="modal-header">
					<h1 id="confirmEnquiryID">ID: </h1>
				</div>
				<div class="modal-body" id="modal-body">
				</div>
				<form class="modal-footer" id="footerForm">
					<button type="submit" class="btn btn-primary" id="submitEnquiry">Confirm</button>
					<button type="button" class="btn btn-danger" id="rejectEnquiry">Reject</button>
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="dismissEnquiry">Dismiss</button>
				</form>

			</div>
		</div>
	</div>
